<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=no, viewport-fit=cover">
    <meta name="theme-color" content="#090d16">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>Qur'on ta'limi - Mobile Web App</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Inter Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

    <style>
        * {
            box-sizing: border-box;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100dvh;
            overflow: hidden;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            transition: background-color 0.35s ease;
        }

        /* Mushaf qog'ozi foni (Kunduzgi va Tungi rejim) */
        body.light-mode {
            background-color: #fcf8ef;
            color: #1e293b;
        }

        body.night-mode {
            background-color: #070a12;
            color: #f8fafc;
        }

        /* To'liq ekranli Qur'on sahifasi konteyneri */
        #viewContainer {
            position: fixed;
            inset: 0;
            width: 100vw;
            height: 100dvh;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            z-index: 1;
            touch-action: none;
        }

        /* Sahifa rasmi: butun ekranni egallaydi */
        #pageImage {
            width: 100vw;
            height: 100dvh;
            max-width: 100vw;
            max-height: 100dvh;
            object-fit: contain;
            display: block;
            transform-origin: center center;
            transition: opacity 0.25s ease, filter 0.35s ease;
            will-change: transform;
        }

        /* Tungi rejim uchun ko'zni charchatmaydigan aqlli filtr */
        body.night-mode #pageImage {
            filter: invert(0.92) hue-rotate(180deg) brightness(0.96) contrast(1.12) sepia(0.14);
        }

        body.light-mode #pageImage {
            filter: multiply contrast(1.03);
        }

        /* Rasm yuklanayotgan vaqtda animatsiya */
        #pageImage.loading {
            opacity: 0.35;
        }

        /* Suzib turuvchi (Floating) Glassmorphism panellar */
        .floating-glass {
            background: rgba(15, 23, 42, 0.84);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid rgba(255, 255, 255, 0.12);
            box-shadow: 0 12px 36px -4px rgba(0, 0, 0, 0.55);
            transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s ease;
        }

        /* UI yashirilganda panellar holati */
        .ui-hidden #topBar {
            transform: translateY(-140%);
            opacity: 0;
            pointer-events: none;
        }

        .ui-hidden #playerCard {
            transform: translateY(130%);
            opacity: 0;
            pointer-events: none;
        }

        /* Mini suzuvchi tugma (faqat UI yashirilganda chiqadi) */
        #miniRestoreBtn {
            opacity: 0;
            transform: scale(0.8) translateY(20px);
            pointer-events: none;
            transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .ui-hidden #miniRestoreBtn {
            opacity: 1;
            transform: scale(1) translateY(0);
            pointer-events: auto;
        }

        /* Tugmalar bosilganda chiroyli effekt */
        .ctrl-btn {
            transition: all 0.16s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .ctrl-btn:active {
            transform: scale(0.90);
        }

        /* Faol A va B tugmalari */
        .ab-btn-active {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
            border-color: rgba(16, 185, 129, 0.6) !important;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.45);
        }

        /* Loop tugmasi faol holatlari */
        .loop-ab-active {
            background: linear-gradient(135deg, #10b981, #059669) !important;
            color: #ffffff !important;
            border-color: rgba(16, 185, 129, 0.6) !important;
            box-shadow: 0 0 16px rgba(16, 185, 129, 0.45);
        }

        .loop-page-active {
            background: rgba(56, 189, 248, 0.2) !important;
            color: #38bdf8 !important;
            border-color: rgba(56, 189, 248, 0.5) !important;
        }

        /* Maxsus Timeline / Progress slider */
        .timeline-wrapper {
            position: relative;
            height: 24px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }

        input[type=range].custom-slider {
            -webkit-appearance: none;
            appearance: none;
            width: 100%;
            height: 6px;
            background: transparent;
            outline: none;
            margin: 0;
            z-index: 20;
            position: relative;
            cursor: pointer;
        }

        input[type=range].custom-slider::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #38bdf8;
            border: 2.5px solid #ffffff;
            box-shadow: 0 2px 8px rgba(56, 189, 248, 0.7);
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        input[type=range].custom-slider::-webkit-slider-thumb:active {
            transform: scale(1.25);
        }

        /* Raqamli input strelkalarini yashirish */
        input[type=number]::-webkit-inner-spin-button,
        input[type=number]::-webkit-outer-spin-button {
            -webkit-appearance: none;
            margin: 0;
        }
        input[type=number] {
            -moz-appearance: textfield;
        }
    </style>
</head>
<body class="light-mode">

    <!-- 1. YUQORI SUZUVCHI PANEL (Rasm yuzasida) -->
    <header id="topBar" class="fixed top-3 left-3 right-3 z-40 max-w-md mx-auto floating-glass rounded-2xl px-3 py-2 flex items-center justify-between gap-2 text-white">
        <!-- Qori tanlash -->
        <div class="relative flex-1 min-w-0">
            <select id="folderSelect" onchange="changeFolder()" aria-label="Qorini tanlang"
                class="w-full bg-slate-800/90 text-slate-100 text-xs sm:text-sm font-semibold rounded-xl pl-3 pr-7 py-2 border border-white/10 outline-none focus:border-sky-400 appearance-none truncate cursor-pointer">
                <option value="audios1">Alijon qori (Tilovat)</option>
                <option value="audios2">Shayx Muhammad Sodiq (Tarjima)</option>
            </select>
            <!-- Pastga strelka SVG -->
            <svg class="w-4 h-4 text-slate-400 pointer-events-none absolute right-2.5 top-1/2 -translate-y-1/2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"/>
            </svg>
        </div>

        <!-- Sahifa boshqaruvi (Oldingi / Sahifa raqami / Keyingi) -->
        <div class="flex items-center gap-1 bg-slate-800/90 p-1 rounded-xl border border-white/10">
            <button onclick="changePage(-1)" class="ctrl-btn w-8 h-8 rounded-lg flex items-center justify-center text-slate-200 hover:bg-slate-700/70 active:bg-slate-600" title="Oldingi sahifa">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/>
                </svg>
            </button>

            <div class="flex items-center px-1">
                <input type="number" id="pageInput" min="1" max="604" value="1" aria-label="Sahifa raqami"
                    class="w-11 bg-transparent text-sky-400 font-bold text-sm text-center outline-none focus:bg-slate-900/80 rounded py-0.5">
                <span class="text-[10px] text-slate-400 font-medium select-none">/604</span>
            </div>

            <button onclick="changePage(1)" class="ctrl-btn w-8 h-8 rounded-lg flex items-center justify-center text-slate-200 hover:bg-slate-700/70 active:bg-slate-600" title="Keyingi sahifa">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.4" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M9 5l7 7-7 7"/>
                </svg>
            </button>
        </div>

        <!-- Tungi / Kunduzgi rejim tugmasi -->
        <button id="themeBtn" onclick="toggleNightMode()" class="ctrl-btn w-9 h-9 rounded-xl bg-slate-800/90 border border-white/10 flex items-center justify-center text-amber-300 hover:bg-slate-700/80 shrink-0" title="Tungi/Kunduzgi rejim">
            <!-- Oy/Quyosh ikonasi JS orqali yangilanadi -->
            <svg id="themeIcon" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
            </svg>
        </button>
    </header>

    <!-- 2. TO'LIQ EKRANLI QUR'ON SAHIFASI -->
    <main id="viewContainer">
        <!-- Yuklanish indikatori -->
        <div id="imageSpinner" class="absolute inset-0 flex items-center justify-center pointer-events-none z-10 hidden">
            <div class="w-10 h-10 rounded-full border-3 border-sky-400/30 border-t-sky-400 animate-spin"></div>
        </div>

        <img id="pageImage" alt="Qur'oni Karim sahifasi" draggable="false"
            onerror="this.onerror=null; this.src='https://placehold.co/800x1200/1e293b/38bdf8?text=Sahifa+yuklanmadi';">
    </main>

    <!-- 3. PASTKI SUZUVCHI TA'LIM VA PLAYER KARTASI (Rasm yuzasida) -->
    <section id="playerCard" class="fixed bottom-4 left-3 right-3 z-40 max-w-md mx-auto floating-glass rounded-3xl px-4 pt-3 pb-3.5 text-white flex flex-col gap-2">
        
        <!-- Tezkor xabar (Status Toast) - Karta tepasida suzib chiqadi -->
        <div id="statusToast" class="pointer-events-none absolute -top-10 left-1/2 -translate-x-1/2 bg-slate-900/95 text-sky-400 border border-sky-500/30 px-3.5 py-1 rounded-full text-xs font-bold tracking-wide shadow-lg opacity-0 transition-opacity duration-200 whitespace-nowrap">
            Tayyor
        </div>

        <!-- A-B Oraliq ma'lumot paneli (Faqat A yoki B tanlanganda ko'rinadi) -->
        <div id="abStatusRow" class="hidden items-center justify-between bg-emerald-950/60 border border-emerald-500/30 rounded-xl px-3 py-1.5 text-xs">
            <div class="flex items-center gap-2">
                <span class="inline-block w-2 h-2 rounded-full bg-emerald-400 animate-pulse"></span>
                <span id="abRangeText" class="font-semibold text-emerald-200">A: 0:00 → B: ...</span>
            </div>
            <div class="flex items-center gap-1.5">
                <!-- A nuqtadan qayta eshitish -->
                <button onclick="jumpToPointA()" class="ctrl-btn px-2 py-0.5 rounded-md bg-emerald-500/20 hover:bg-emerald-500/30 text-emerald-300 font-semibold flex items-center gap-1" title="A nuqtadan qayta ijro etish">
                    <svg class="w-3 h-3" fill="currentColor" viewBox="0 0 24 24"><path d="M8 5v14l11-7z"/></svg>
                    <span>Qayta</span>
                </button>
                <!-- A-B oraliqni tozalash -->
                <button onclick="clearABLoop(true)" class="ctrl-btn w-6 h-6 rounded-md bg-rose-500/20 hover:bg-rose-500/30 text-rose-300 flex items-center justify-center font-bold" title="A-B oraliqni bekor qilish">
                    ✕
                </button>
            </div>
        </div>

        <!-- Vaqt va Maxsus Progress Bar (A-B yashil chizig'i bilan) -->
        <div class="flex items-center gap-2.5">
            <span id="currTime" class="text-[11px] font-semibold text-slate-300 w-9 text-right tabular-nums">0:00</span>

            <div class="timeline-wrapper flex-1">
                <!-- Orqa fon yo'lagi -->
                <div class="w-full h-1.5 bg-slate-700/80 rounded-full overflow-hidden relative pointer-events-none">
                    <!-- O'tilgan vaqt ko'k chizig'i -->
                    <div id="progressFill" class="h-full bg-sky-400/80 rounded-full w-0"></div>
                    <!-- A va B orasidagi yashil belgi -->
                    <div id="abHighlightBar" class="hidden absolute top-0 bottom-0 bg-emerald-400/90 rounded-full"></div>
                </div>

                <!-- Haqiqiy boshqariladigan Slider -->
                <input type="range" id="progress" class="custom-slider !absolute inset-0" value="0" min="0" max="100" step="0.1" aria-label="Audio vaqti">
            </div>

            <span id="durTime" class="text-[11px] font-semibold text-slate-400 w-9 tabular-nums">0:00</span>
        </div>

        <!-- ENG KERAKLI 6 TA TA'LIM TUGMASI (SVG ikonkalar bilan) -->
        <div class="flex items-center justify-between pt-0.5 px-1">
            
            <!-- 1. [A] Boshlanish nuqtasi -->
            <button onclick="setPointA()" id="btnA" class="ctrl-btn w-11 h-11 rounded-2xl bg-slate-800/90 border border-white/10 flex flex-col items-center justify-center text-slate-200 hover:bg-slate-700/80" title="A nuqtani belgilash (1)">
                <span class="text-xs font-extrabold tracking-tight leading-none">A</span>
                <span class="text-[9px] text-slate-400 font-medium mt-0.5 leading-none">Boshi</span>
            </button>

            <!-- 2. [B] Tugash nuqtasi -->
            <button onclick="setPointB()" id="btnB" class="ctrl-btn w-11 h-11 rounded-2xl bg-slate-800/90 border border-white/10 flex flex-col items-center justify-center text-slate-200 hover:bg-slate-700/80" title="B nuqtani belgilash (3)">
                <span class="text-xs font-extrabold tracking-tight leading-none">B</span>
                <span class="text-[9px] text-slate-400 font-medium mt-0.5 leading-none">Oxiri</span>
            </button>

            <!-- 3. [-3s] 3 soniya orqaga qaytarish (Yodlash uchun juda muhim) -->
            <button onclick="skipTime(-3)" class="ctrl-btn w-11 h-11 rounded-2xl bg-slate-800/90 border border-white/10 flex flex-col items-center justify-center text-slate-200 hover:bg-slate-700/80" title="3 soniya orqaga (4)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M3 10h10a8 8 0 018 8v2M3 10l5 5m-5-5l5-5"/>
                </svg>
                <span class="text-[9px] text-slate-400 font-semibold leading-none mt-0.5">-3s</span>
            </button>

            <!-- 4. [Play / Pause] Asosiy markaziy tugma -->
            <button onclick="togglePlay()" id="playBtn" class="ctrl-btn w-14 h-14 rounded-full bg-gradient-to-tr from-sky-500 to-cyan-300 text-slate-950 flex items-center justify-center shadow-lg shadow-sky-500/30 border border-white/20" title="Ijro / To'xtatish (Space)">
                <!-- Play SVG -->
                <svg id="playIcon" class="w-7 h-7 ml-0.5" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M8 5.14v14l11-7-11-7z"/>
                </svg>
                <!-- Pause SVG (yashirin) -->
                <svg id="pauseIcon" class="w-7 h-7 hidden" fill="currentColor" viewBox="0 0 24 24">
                    <path d="M6 19h4V5H6v14zm8-14v14h4V5h-4z"/>
                </svg>
            </button>

            <!-- 5. [Loop] Takrorlash (A-B yoki Sahifa takrori) -->
            <button onclick="toggleABLoop()" id="abLoopBtn" class="ctrl-btn relative w-11 h-11 rounded-2xl bg-slate-800/90 border border-white/10 flex flex-col items-center justify-center text-slate-200 hover:bg-slate-700/80" title="Takrorlash rejimi (/)">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                </svg>
                <span id="loopModeLabel" class="text-[9px] text-slate-400 font-semibold leading-none mt-0.5">Takror</span>
            </button>

            <!-- 6. [1x] Tezlikni boshqarish -->
            <button onclick="toggleSpeed()" id="speedBtn" class="ctrl-btn w-11 h-11 rounded-2xl bg-slate-800/90 border border-white/10 flex flex-col items-center justify-center text-sky-400 hover:bg-slate-700/80" title="Tilovat tezligi (*)">
                <span id="speedValueText" class="text-xs font-extrabold leading-none">1x</span>
                <span class="text-[9px] text-slate-400 font-medium mt-0.5 leading-none">Tezlik</span>
            </button>

        </div>
    </section>

    <!-- 4. MINI SUZUVCHI TUGMA (To'liq ekran o'qish rejimida UI yashirilganda ko'rinadi) -->
    <button id="miniRestoreBtn" onclick="toggleUIVisibility()" class="fixed bottom-5 right-5 z-50 floating-glass w-12 h-12 rounded-full flex items-center justify-center text-sky-400 border border-sky-400/30 shadow-2xl" title="Boshqaruv panelini ko'rsatish">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" d="M9 19V6l12-3v13M9 19c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zm12-3c0 1.105-1.343 2-3 2s-3-.895-3-2 1.343-2 3-2 3 .895 3 2zM9 10l12-3"/>
        </svg>
    </button>

    <audio id="audio" preload="auto"></audio>

    <script>
        /* =========================================================
           1. MA'LUMOTLAR BAZASI (JSON + Dinamik 604 sahifa generatori)
           ========================================================= */
        const quranDatabase = {
            images: {
                1: "https://www.searchtruth.com/quran/images/images2/large/page-001.jpeg",
                2: "https://www.searchtruth.com/quran/images/images2/large/page-002.jpeg",
                3: "https://www.searchtruth.com/quran/images/images2/large/page-003.jpeg",
            },
            audios: {
                "audios1": {
                    1: "https://s3.alquran.uz/al-quran-qiroat/ShayxAlijonQori/1-bet.mp3",
                    2: "https://s3.alquran.uz/al-quran-qiroat/ShayxAlijonQori/2-bet.mp3",
                    3: "https://s3.alquran.uz/al-quran-qiroat/ShayxAlijonQori/3-bet.mp3",
                },
                "audios2": {
                    1: "https://s3.alquran.uz/al-quran-qiroat/ShayxMuhammadsodiqtarjima/001.mp3",
                    2: "https://s3.alquran.uz/al-quran-qiroat/ShayxMuhammadsodiqtarjima/002.mp3",
                    3: "https://s3.alquran.uz/al-quran-qiroat/ShayxMuhammadsodiqtarjima/003.mp3",
                }
            }
        };

        /* =========================================================
           2. HOLAT (STATE) O'ZGARUVCHILARI
           ========================================================= */
        let currentPage = localStorage.getItem("page") ? parseInt(localStorage.getItem("page")) : 1;
        let currentFolder = localStorage.getItem("audioFolder") ? localStorage.getItem("audioFolder") : "audios1";
        let isNightMode = localStorage.getItem("nightMode") === "true";

        const speeds = [0.5, 0.75, 1, 1.25, 1.5, 2];
        let speedIndex = localStorage.getItem("speedIndex") ? parseInt(localStorage.getItem("speedIndex")) : 2; // 1x default
        if (speedIndex < 0 || speedIndex >= speeds.length) speedIndex = 2;

        let pageLoop = false;
        let uiVisible = true;

        // A-B Loop o'zgaruvchilari
        const OFFSET = 0.2;
        let pointA = null;
        let pointB = null;
        let isABLooping = false;
        let loopInterval = null;
        let toastTimeout = null;

        // Zoom va Pan (Surish) o'zgaruvchilari
        let scale = 1;
        let translateX = 0;
        let translateY = 0;

        /* =========================================================
           3. DOM ELEMENTLAR
           ========================================================= */
        const audio = document.getElementById("audio");
        const img = document.getElementById("pageImage");
        const imageSpinner = document.getElementById("imageSpinner");
        const viewContainer = document.getElementById("viewContainer");
        const playBtn = document.getElementById("playBtn");
        const playIcon = document.getElementById("playIcon");
        const pauseIcon = document.getElementById("pauseIcon");
        const progress = document.getElementById("progress");
        const progressFill = document.getElementById("progressFill");
        const abHighlightBar = document.getElementById("abHighlightBar");
        const pageInput = document.getElementById("pageInput");
        const speedValueText = document.getElementById("speedValueText");
        const folderSelect = document.getElementById("folderSelect");
        const statusToast = document.getElementById("statusToast");
        const btnA = document.getElementById("btnA");
        const btnB = document.getElementById("btnB");
        const abLoopBtn = document.getElementById("abLoopBtn");
        const loopModeLabel = document.getElementById("loopModeLabel");
        const abStatusRow = document.getElementById("abStatusRow");
        const abRangeText = document.getElementById("abRangeText");
        const themeIcon = document.getElementById("themeIcon");

        /* =========================================================
           4. DASTLABKI ISHGA TUSHIRISH
           ========================================================= */
        folderSelect.value = currentFolder;
        speedValueText.innerText = speeds[speedIndex] + "x";
        applyNightModeUI();
        updateUI(false); // Sahifa ochilganda yuklab qo'yish

        function pad3(n) {
            return String(n).padStart(3, "0");
        }

        function getPageImageUrl(page) {
            if (quranDatabase.images[page]) return quranDatabase.images[page];
            return `https://www.searchtruth.com/quran/images/images2/large/page-${pad3(page)}.jpeg`;
        }

        function getPageAudioUrl(folder, page) {
            if (quranDatabase.audios[folder] && quranDatabase.audios[folder][page]) {
                return quranDatabase.audios[folder][page];
            }
            if (folder === "audios1") {
                return `https://s3.alquran.uz/al-quran-qiroat/ShayxAlijonQori/${page}-bet.mp3`;
            } else {
                return `https://s3.alquran.uz/al-quran-qiroat/ShayxMuhammadsodiqtarjima/${pad3(page)}.mp3`;
            }
        }

        function updateUI(autoPlay = true) {
            clearABLoop(false);
            resetZoom();

            // Rasmni yangilash
            img.classList.add("loading");
            imageSpinner.classList.remove("hidden");
            img.src = getPageImageUrl(currentPage);

            img.onload = () => {
                img.classList.remove("loading");
                imageSpinner.classList.add("hidden");
            };
            img.onerror = () => {
                img.classList.remove("loading");
                imageSpinner.classList.add("hidden");
            };

            // Keyingi sahifa rasmini oldindan keshga yuklab qo'yish (Preload)
            if (currentPage < 604) {
                const preloadImg = new Image();
                preloadImg.src = getPageImageUrl(currentPage + 1);
            }

            // Audioni yangilash
            audio.src = getPageAudioUrl(currentFolder, currentPage);
            pageInput.value = currentPage;

            localStorage.setItem("page", currentPage);
            localStorage.setItem("audioFolder", currentFolder);
            audio.playbackRate = speeds[speedIndex];

            if (autoPlay) {
                audio.play().then(() => {
                    setPlayIconState(true);
                }).catch(() => {
                    setPlayIconState(false);
                });
            } else {
                setPlayIconState(false);
            }
        }

        function setPlayIconState(isPlaying) {
            if (isPlaying) {
                playIcon.classList.add("hidden");
                pauseIcon.classList.remove("hidden");
            } else {
                playIcon.classList.remove("hidden");
                pauseIcon.classList.add("hidden");
            }
        }

        /* =========================================================
           5. TUNGI REJIM VA EKRAN BOSHQARUVI
           ========================================================= */
        function toggleNightMode() {
            isNightMode = !isNightMode;
            localStorage.setItem("nightMode", isNightMode);
            applyNightModeUI();
            showStatus(isNightMode ? "Tungi rejim yoqildi" : "Kunduzgi rejim yoqildi");
        }

        function applyNightModeUI() {
            if (isNightMode) {
                document.body.classList.remove("light-mode");
                document.body.classList.add("night-mode");
                // Quyosh ikonasi
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>`;
            } else {
                document.body.classList.remove("night-mode");
                document.body.classList.add("light-mode");
                // Oy ikonasi
                themeIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>`;
            }
        }

        function toggleUIVisibility() {
            uiVisible = !uiVisible;
            document.body.classList.toggle("ui-hidden", !uiVisible);
        }

        function showStatus(text, duration = 1600) {
            statusToast.innerText = text;
            statusToast.style.opacity = "1";
            if (toastTimeout) clearTimeout(toastTimeout);
            if (duration) {
                toastTimeout = setTimeout(() => {
                    statusToast.style.opacity = "0";
                }, duration);
            }
        }

        /* =========================================================
           6. A-B YODLASH (LOOP) MANTIQLARI
           ========================================================= */
        function setPointA() {
            pointA = Math.max(0, audio.currentTime - OFFSET);
            btnA.classList.add("ab-btn-active");
            btnB.classList.remove("ab-btn-active");
            isABLooping = false;
            pointB = null;
            if (loopInterval) clearInterval(loopInterval);
            updateLoopButtonStyle();
            updateABVisuals();
            showStatus(`A nuqta: ${format(pointA)}`);
        }

        function setPointB() {
            if (pointA === null) {
                showStatus("Avval A nuqtani bosing!");
                return;
            }
            let calculatedB = audio.currentTime;
            if (calculatedB <= pointA + 0.3) {
                showStatus("B nuqta A dan keyin bo'lishi kerak");
                return;
            }
            pointB = calculatedB;
            btnB.classList.add("ab-btn-active");
            
            // Yodlash uchun qulaylik: B bosilishi bilan avtomatik A-B takrorlash (Loop) yoqiladi
            isABLooping = true;
            updateLoopButtonStyle();
            updateABVisuals();
            showStatus(`A-B takrorlash boshlandi`);
            startABLoopEngine();
        }

        function startABLoopEngine() {
            if (pointA === null || pointB === null) return;
            audio.currentTime = pointA;
            if (audio.paused) {
                audio.play().then(() => setPlayIconState(true)).catch(() => {});
            }
            if (loopInterval) clearInterval(loopInterval);

            loopInterval = setInterval(() => {
                if (pointB !== null && audio.currentTime >= pointB && !audio.paused) {
                    if (isABLooping) {
                        audio.pause();
                        setTimeout(() => {
                            if (isABLooping && pointA !== null) {
                                audio.currentTime = pointA;
                                audio.play().then(() => setPlayIconState(true)).catch(() => {});
                            }
                        }, 200);
                    } else {
                        // Bir martalik A-B ijro tugashi
                        audio.pause();
                        setPlayIconState(false);
                        clearInterval(loopInterval);
                        loopInterval = null;
                    }
                }
            }, 15);
        }

        function playABOnce() {
            if (pointA === null) return;
            isABLooping = false;
            updateLoopButtonStyle();
            startABLoopEngine();
        }

        function toggleABLoop() {
            // Agar A va B belgilangan bo'lsa -> A-B Loopni yoqadi/o'chiradi
            if (pointA !== null && pointB !== null) {
                isABLooping = !isABLooping;
                updateLoopButtonStyle();
                if (isABLooping) {
                    showStatus("A-B Takrorlash: Yoqildi");
                    startABLoopEngine();
                } else {
                    showStatus("A-B Takrorlash: To'xtatildi");
                    if (loopInterval) clearInterval(loopInterval);
                }
                return;
            }

            // Agar A-B belgilanmagan bo'lsa -> Butun sahifani takrorlashni yoqadi/o'chiradi
            pageLoop = !pageLoop;
            updateLoopButtonStyle();
            showStatus(pageLoop ? "Sahifa takrori: Yoqildi" : "Sahifa takrori: O'chirildi");
        }

        function jumpToPointA() {
            if (pointA === null) {
                showStatus("A nuqta belgilanmagan");
                return;
            }
            audio.currentTime = pointA;
            if (audio.paused) {
                audio.play().then(() => setPlayIconState(true)).catch(() => {});
            }
            showStatus("A nuqtadan boshlandi");
        }

        function clearABLoop(notify = false) {
            pointA = null;
            pointB = null;
            isABLooping = false;
            if (loopInterval) {
                clearInterval(loopInterval);
                loopInterval = null;
            }
            btnA.classList.remove("ab-btn-active");
            btnB.classList.remove("ab-btn-active");
            updateLoopButtonStyle();
            updateABVisuals();
            if (notify) showStatus("A-B oraliq tozalandi");
        }

        function updateLoopButtonStyle() {
            abLoopBtn.classList.remove("loop-ab-active", "loop-page-active");
            if (isABLooping) {
                abLoopBtn.classList.add("loop-ab-active");
                loopModeLabel.innerText = "A-B";
                loopModeLabel.classList.replace("text-slate-400", "text-white");
            } else if (pageLoop) {
                abLoopBtn.classList.add("loop-page-active");
                loopModeLabel.innerText = "Sahifa";
                loopModeLabel.classList.replace("text-white", "text-slate-400");
            } else {
                loopModeLabel.innerText = "Takror";
                loopModeLabel.classList.remove("text-white");
                loopModeLabel.classList.add("text-slate-400");
            }
        }

        function updateABVisuals() {
            // A-B Status qatorini yangilash
            if (pointA !== null) {
                abStatusRow.classList.remove("hidden");
                abStatusRow.classList.add("flex");
                const bText = pointB !== null ? format(pointB) : "...";
                abRangeText.innerText = `A: ${format(pointA)} → B: ${bText}`;
            } else {
                abStatusRow.classList.add("hidden");
                abStatusRow.classList.remove("flex");
            }

            // Timeline ustidagi yashil A-B chizig'ini chizish
            const dur = audio.duration || 0;
            if (pointA !== null && dur > 0) {
                const startPct = Math.min(100, Math.max(0, (pointA / dur) * 100));
                const endPct = pointB !== null ? Math.min(100, Math.max(startPct, (pointB / dur) * 100)) : startPct + 1.5;
                abHighlightBar.style.left = `${startPct}%`;
                abHighlightBar.style.width = `${Math.max(1.5, endPct - startPct)}%`;
                abHighlightBar.classList.remove("hidden");
            } else {
                abHighlightBar.classList.add("hidden");
            }
        }

        /* =========================================================
           7. AUDIO VA SAHIFA BOSHQARUVI
           ========================================================= */
        function changeFolder() {
            currentFolder = folderSelect.value;
            const qoriName = currentFolder === "audios1" ? "Alijon qori" : "Shayx Muhammad Sodiq";
            showStatus(qoriName);
            updateUI(true);
        }

        function changePage(delta) {
            let next = currentPage + delta;
            if (next < 1) {
                showStatus("1-sahifa (Boshi)");
                return;
            }
            if (next > 604) {
                showStatus("604-sahifa (Oxiri)");
                return;
            }
            currentPage = next;
            showStatus(`${currentPage}-sahifa`);
            updateUI(true);
        }

        function prevAudio() { changePage(-1); }
        function nextAudio() { changePage(1); }

        function togglePlay() {
            if (audio.paused) {
                if (pointA !== null && pointB !== null && (audio.currentTime >= pointB || audio.currentTime < pointA)) {
                    audio.currentTime = pointA;
                }
                audio.play().then(() => setPlayIconState(true)).catch(() => setPlayIconState(false));
            } else {
                audio.pause();
                setPlayIconState(false);
            }
        }

        function skipTime(sec) {
            audio.currentTime = Math.max(0, Math.min(audio.duration || 0, audio.currentTime + sec));
            showStatus(`${sec > 0 ? '+' : ''}${sec} soniya`);
        }

        function toggleSpeed() {
            speedIndex = (speedIndex + 1) % speeds.length;
            audio.playbackRate = speeds[speedIndex];
            speedValueText.innerText = speeds[speedIndex] + "x";
            localStorage.setItem("speedIndex", speedIndex);
            showStatus(`Tezlik: ${speeds[speedIndex]}x`);
        }

        audio.ontimeupdate = () => {
            const dur = audio.duration || 0;
            const curr = audio.currentTime || 0;
            progress.max = dur;
            progress.value = curr;

            const pct = dur > 0 ? (curr / dur) * 100 : 0;
            progressFill.style.width = `${pct}%`;

            document.getElementById("currTime").innerText = format(curr);
            document.getElementById("durTime").innerText = format(dur);
            updateABVisuals();
        };

        audio.onloadedmetadata = () => {
            document.getElementById("durTime").innerText = format(audio.duration);
            updateABVisuals();
        };

        progress.oninput = () => {
            audio.currentTime = parseFloat(progress.value);
        };

        audio.onended = () => {
            if (isABLooping && pointA !== null) {
                audio.currentTime = pointA;
                audio.play().then(() => setPlayIconState(true)).catch(() => {});
                return;
            }
            if (pageLoop) {
                audio.currentTime = 0;
                audio.play().then(() => setPlayIconState(true)).catch(() => {});
            } else {
                nextAudio();
            }
        };

        function format(s) {
            if (isNaN(s) || !isFinite(s)) return "0:00";
            let m = Math.floor(s / 60);
            let sec = Math.floor(s % 60);
            return m + ":" + (sec < 10 ? "0" : "") + sec;
        }

        pageInput.onchange = () => {
            let v = parseInt(pageInput.value);
            if (!isNaN(v)) {
                v = Math.max(1, Math.min(604, v));
                currentPage = v;
                updateUI(true);
            } else {
                pageInput.value = currentPage;
            }
        };

        /* =========================================================
           8. SENSORLI JESTLAR: TAP (UI YASHIRISH), SWIPE, PINCH-ZOOM
           ========================================================= */
        let touchStartX = 0;
        let touchStartY = 0;
        let touchStartTime = 0;
        let lastTapTime = 0;
        let initialPinchDist = 0;
        let initialScale = 1;
        let isDraggingZoom = false;
        let dragStartX = 0;
        let dragStartY = 0;

        function applyTransform() {
            if (scale <= 1.02) {
                scale = 1;
                translateX = 0;
                translateY = 0;
            }
            img.style.transform = `translate3d(${translateX}px, ${translateY}px, 0) scale(${scale})`;
        }

        function resetZoom() {
            scale = 1;
            translateX = 0;
            translateY = 0;
            applyTransform();
        }

        viewContainer.addEventListener("touchstart", (e) => {
            if (e.touches.length === 2) {
                // Ikki barmoq bilan Zoom boshlandi
                initialPinchDist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                initialScale = scale;
            } else if (e.touches.length === 1) {
                touchStartX = e.touches[0].clientX;
                touchStartY = e.touches[0].clientY;
                touchStartTime = Date.now();

                if (scale > 1.05) {
                    isDraggingZoom = true;
                    dragStartX = touchStartX - translateX;
                    dragStartY = touchStartY - translateY;
                }
            }
        }, { passive: true });

        viewContainer.addEventListener("touchmove", (e) => {
            if (e.touches.length === 2 && initialPinchDist > 0) {
                const dist = Math.hypot(
                    e.touches[0].clientX - e.touches[1].clientX,
                    e.touches[0].clientY - e.touches[1].clientY
                );
                scale = Math.min(Math.max(1, initialScale * (dist / initialPinchDist)), 3.5);
                applyTransform();
            } else if (e.touches.length === 1 && isDraggingZoom && scale > 1.05) {
                const maxPanX = (window.innerWidth * (scale - 1)) / 2;
                const maxPanY = (window.innerHeight * (scale - 1)) / 2;
                translateX = Math.min(maxPanX, Math.max(-maxPanX, e.touches[0].clientX - dragStartX));
                translateY = Math.min(maxPanY, Math.max(-maxPanY, e.touches[0].clientY - dragStartY));
                applyTransform();
            }
        }, { passive: true });

        viewContainer.addEventListener("touchend", (e) => {
            if (e.touches.length < 2) {
                initialPinchDist = 0;
            }
            if (e.touches.length === 0) {
                isDraggingZoom = false;
            }

            if (e.changedTouches.length === 1) {
                const endX = e.changedTouches[0].clientX;
                const endY = e.changedTouches[0].clientY;
                const deltaX = endX - touchStartX;
                const deltaY = endY - touchStartY;
                const elapsed = Date.now() - touchStartTime;

                // 1) Agar zoom qilinmagan bo'lsa va gorizontal swipe bo'lsa -> Sahifa almashtirish
                if (scale <= 1.05 && Math.abs(deltaX) > 60 && Math.abs(deltaY) < 75 && elapsed < 500) {
                    if (deltaX < 0) {
                        nextAudio(); // Chapga surish -> Keyingi sahifa
                    } else {
                        prevAudio(); // O'ngga surish -> Oldingi sahifa
                    }
                    return;
                }

                // 2) Qisqa bosish (Tap yoki Double-Tap)
                if (Math.abs(deltaX) < 12 && Math.abs(deltaY) < 12 && elapsed < 280) {
                    const now = Date.now();
                    if (now - lastTapTime < 280) {
                        // Ikki marta tez bosish (Double-tap) -> Zoom 2x yoki 1x
                        if (scale > 1.05) {
                            resetZoom();
                        } else {
                            scale = 2;
                            applyTransform();
                        }
                        lastTapTime = 0;
                    } else {
                        lastTapTime = now;
                        setTimeout(() => {
                            if (Date.now() - lastTapTime >= 270 && lastTapTime !== 0) {
                                // Bir marta bosish -> UI panellarni yashirish/ko'rsatish
                                toggleUIVisibility();
                            }
                        }, 280);
                    }
                }
            }
        });

        // Kompyuterda sichqoncha bilan rasm ustiga bosganda ham UI yashirish/ochish
        viewContainer.addEventListener("click", (e) => {
            if (e.pointerType === "mouse") {
                toggleUIVisibility();
            }
        });

        /* =========================================================
           9. KLAVIATURA QISQARTMALARI (Kompyuter uchun ham qulay)
           ========================================================= */
        document.addEventListener("keydown", (e) => {
            if (e.target.tagName === "INPUT" || e.target.tagName === "SELECT") return;
            switch (e.key) {
                case " ":
                case "5":
                    e.preventDefault();
                    togglePlay();
                    break;
                case "1":
                    e.preventDefault();
                    setPointA();
                    break;
                case "3":
                    e.preventDefault();
                    setPointB();
                    break;
                case ".":
                    e.preventDefault();
                    jumpToPointA();
                    break;
                case "/":
                    e.preventDefault();
                    toggleABLoop();
                    break;
                case "7":
                    e.preventDefault();
                    clearABLoop(true);
                    break;
                case "ArrowRight":
                    e.preventDefault();
                    nextAudio();
                    break;
                case "ArrowLeft":
                    e.preventDefault();
                    prevAudio();
                    break;
                case "4":
                    e.preventDefault();
                    skipTime(-3);
                    break;
                case "6":
                    e.preventDefault();
                    skipTime(3);
                    break;
                case "*":
                    e.preventDefault();
                    toggleSpeed();
                    break;
            }
        });
    </script>
</body>
